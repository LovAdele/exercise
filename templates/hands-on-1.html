<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hands-on 1</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1f6feb 0%, #0b2545 45%, #060d1a 100%);
      color: #eaf2ff;
    }

    .card {
      width: min(620px, 100%);
      padding: 48px 40px;
      border-radius: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
    }

    .badge {
      display: inline-block;
      margin-bottom: 24px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ecbff;
      background: rgba(31, 111, 235, 0.22);
      border: 1px solid rgba(158, 203, 255, 0.35);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.35;
      font-weight: 600;
    }

    p {
      margin: 0;
      font-size: 16px;
      line-height: 1.7;
      color: #c2d4ea;
    }

    .student-id {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 17px;
      letter-spacing: 0.04em;
      color: #eaf2ff;
    }

    .port {
      margin-top: 14px;
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 14px;
      color: #8ff0c0;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Hands-on 1</span>
    <h1>Hands-on 3: GitHub Collaboration Demo</h1>
    <p>Flask &middot; served from your machine to everyone on the same network.</p>
    <div class="student-id">Student ID: 124020465</div>
    <div class="port">port 8000</div>
    <div class="port"><a href="/about" style="color: #9ecbff;">About page &rarr;</a></div>
  </main>
</body>
</html>
