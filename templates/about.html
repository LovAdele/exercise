<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1f6feb 0%, #0b2545 45%, #060d1a 100%);
      color: #eaf2ff;
    }

    .card {
      width: min(620px, 100%);
      padding: 48px 40px;
      border-radius: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
    }

    .badge {
      display: inline-block;
      margin-bottom: 24px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ecbff;
      background: rgba(31, 111, 235, 0.22);
      border: 1px solid rgba(158, 203, 255, 0.35);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.35;
      font-weight: 600;
    }

    a {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 15px;
      color: #eaf2ff;
      text-decoration: none;
      background: rgba(31, 111, 235, 0.35);
      border: 1px solid rgba(158, 203, 255, 0.35);
    }

    a:hover { background: rgba(31, 111, 235, 0.55); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">About</span>
    <h1>About page by ZhaoSijia</h1>
    <a href="/">&larr; Back to home</a>
  </main>
</body>
</html>
