name: CI/CD Pipeline

# Triggers: when to run this workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- CI: verify the app builds and dependencies install ----
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify app can be imported
        run: |
          python -c "import app; print('App imported successfully')"

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py

  # ---- CD: simulated deployment (runs only after CI passes on push) ----
  deploy:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy step (simulated)
        run: |
          echo "Deployment would start here."
          echo "App: Flask hello-world on port 8000"
          echo "Deployed successfully (simulation)."
